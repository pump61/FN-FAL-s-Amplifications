name: FNAmplifications
version: '${project.version}'
main: ne.fnfal113.fnamplifications.FNAmplifications
api-version: 1.16
authors: [ FN_FAL113 ]
description: Explore uma infinidade de itens do jogo, de maquinas e ferramentas a itens de PVP e muito mais!
website: https://github.com/FN-FAL113
depend: [Slimefun]
softdepend:
  - GuizhanLibPlugin
  - LiteXpansion
  - SimpleMaterialGenerators
  - Vault
commands:
  fngear:
    description: comando para verificar o progresso dos Equipamentos FN
    default: true
    usage: /<command>
  fnshockwavetest:
    description: comando base para testar a onda de choque
    default: op
    usage: /<command>
permissions:
  fngear.levelupgears:
    description: para aprimorar os Equipamentos FN vestidos pelo jogador
    default: op
  fnshockwave.test:
    description: para testar a onda de choque
    default: op
