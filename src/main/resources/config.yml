# Alterna se você quer receber notificações de novas atualizações toda vez que o servidor reiniciar, caso uma nova versão seja lançada.
# Se definido como "false" você não receberá notificações de novas atualizações e precisará atualizar manualmente.
auto-update: true

# Itens do LiteXpansion (iridio) serão usados como receitas para o FN PowerXpansion
# Só funciona se o LiteXpansion estiver instalado e o valor for true
LiteX-Recipe-Integration: true

# Itens do SimpleMaterialGenerators como algumas receitas para os FN Material Generators
# Mesma lógica acima, só funciona se o SMG estiver instalado e o valor for true
SMG-Recipe-Integration: true

# Usa itens da 1.17 (como ametista, cobre, calcita, etc) em algumas receitas dos itens de maquinário FN
# Só funciona se o servidor estiver rodando 1.17 e o valor for true
New-Recipe-Integration: true

# Validador de efeito de armadura, o tempo em segundos para atualizar os efeitos da armadura (ex: efeitos permanentes do FN Gears of Friction)
# Por enquanto apenas o peitoral possui um efeito permanente, a partir do nível 30
armor-update-period: 10

# Ativa ou desativa módulos do addon
# As subcategorias serão removidas do guia ao desativar
Enable-Machineries: true
Enable-Material-Generators: true
Enable-Gems: true
Enable-Gears: true
Enable-Mystery-Sticks: true
Enable-Solar-Generators: true
Enable-PowerXpansion: true
Enable-Staffs: true
Enable-Quivers: true
Enable-Misc: true

# Permite que os geradores de materiais se danifiquem com o tempo
Enable-Mat-Gen-Break-Over-Time: true
# Permite que os geradores de materiais deixem cair a variante danificada apenas ao quebrar o bloco
Enable-Mat-Gen-Broken-Drop: true

